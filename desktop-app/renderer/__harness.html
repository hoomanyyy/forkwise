<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self' https: http: ws: wss:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forkwise harness</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/app.css" />
    <link rel="stylesheet" href="styles/chat.css" />
    <link rel="stylesheet" href="styles/panel.css" />
  </head>
  <body>
    <div id="titlebar">
      <div class="tb-left">
        <button class="tb-btn" id="btnSidebar" title="Toggle sidebar (Ctrl+\)" aria-label="Toggle sidebar"></button>
        <div class="brand">
          <span class="brand-mark">F</span>
          <span class="brand-name">Forkwise</span>
        </div>
      </div>
      <div class="tb-center"><span id="tbTitle">New chat</span></div>
      <div class="tb-right">
        <button class="tb-btn" id="btnPanel" title="Toggle panel (Ctrl+B)" aria-label="Toggle panel"></button>
        <div class="win-controls">
          <button class="win-btn" id="win-minimize" aria-label="Minimize"><span class="glyph"></span></button>
          <button class="win-btn" id="win-maximize" aria-label="Maximize"><span class="glyph"></span></button>
          <button class="win-btn close" id="win-close" aria-label="Close"><span class="glyph"></span></button>
        </div>
      </div>
    </div>

    <section id="login" hidden>
      <div class="login-card">
        <div class="login-brand"><span class="brand-mark lg">F</span><span>Forkwise</span></div>
        <h1 id="loginTitle">Sign in to your computer</h1>
        <p id="loginDetail" class="login-detail"></p>
        <button class="btn primary wide" id="btnLogin">Continue in the browser</button>
        <p class="login-hint" id="loginHint">A browser window opens. Sign in with your forkwiseai.com account and this app picks it up automatically.</p>
        <div class="login-error" id="loginError" hidden></div>
        <button class="btn ghost sm" id="btnRetry" hidden>Retry connection</button>
      </div>
    </section>

    <div id="app" hidden>
      <div id="banner" class="banner" hidden></div>
      <aside id="sidebar">
        <div class="side-top">
          <button class="new-chat" id="btnNew">
            <span class="plus">+</span>
            <span>New chat</span>
          </button>
          <div class="side-search">
            <span class="search-ico"></span>
            <input id="chatSearch" type="text" placeholder="Search chats" spellcheck="false" />
          </div>
        </div>
        <div id="chatList" class="chat-list"></div>
        <div class="side-foot">
          <button class="device-row" id="deviceRow" title="Computer"></button>
          <button class="account" id="account"></button>
        </div>
      </aside>

      <main id="main">
        <div id="stage">
          <div id="thread"></div>
          <div id="composerDock"></div>
        </div>
      </main>

      <aside id="panel">
        <div id="panelHead" class="panel-head"></div>
        <div id="panelBody" class="panel-body"></div>
      </aside>
    </div>

    <script src="harness/contract.js"></script>
    <script src="harness/mock.js"></script>
    <script src="../shared/markdown.js"></script>
    <script src="../shared/labels.js"></script>
    <script src="js/util.js"></script>
    <script src="js/store.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/composer.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/panel.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/app.js"></script>
    <script src="harness/probe.js"></script>
  </body>
</html>
