<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Forkwise</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #11110f; color: #e8e4da; font: 15px/1.5 system-ui, sans-serif; }
  .box { max-width: 420px; text-align: center; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 8px; font-weight: 600; }
  p { color: #a39e92; margin: 0 0 18px; }
  button { background: #e8e4da; color: #11110f; border: 0; border-radius: 8px; padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
  <h1>Can't reach Forkwise</h1>
  <p id="why">Check your internet connection and try again.</p>
  <button id="retry" type="button">Try again</button>
</div>
<script>
  var params = new URLSearchParams(location.search)
  var why = params.get("why")
  if (why) document.getElementById("why").textContent = "Check your internet connection and try again. (" + why + ")"
  document.getElementById("retry").onclick = function () {
    location.href = params.get("to")
  }
</script>
</body>
</html>
