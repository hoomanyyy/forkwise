<!doctype html>
<html>
<head><meta charset="utf-8"><title>Allow Forkwise?</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="wrap">
  <div class="head"><img src="icons/icon48.png" alt=""><div><h1>Allow Forkwise on this site?</h1><small>The Forkwise agent asks to work in your browser</small></div></div>
  <div class="ask-site" id="site"></div>
  <div class="ask-what" id="what"></div>
  <div class="choices">
    <button class="primary" id="once">Allow this time</button>
    <button id="always">Always allow on this site</button>
    <button class="danger" id="deny">Don't allow</button>
  </div>
  <div class="note">Forkwise uses your signed in session on this site, so it can see and do what you can. Allow only sites you trust it with.</div>
  <div class="timer" id="timer"></div>
</div>
<script src="approve.js"></script>
</body>
</html>
