name: Build Android APK

# Builds the Forkwise Android app and attaches forkwise.apk to the run.
# Open the run on GitHub > Actions, then download "forkwise-apk" at the bottom.

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install packages
        run: npm ci

      - name: Build the web part
        run: npm run build

      - name: Copy it into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk forkwise.apk

      - uses: actions/upload-artifact@v4
        with:
          name: forkwise-apk
          path: mobile/forkwise.apk
