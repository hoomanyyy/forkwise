name: Desktop app release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - name: Linux packages for the screen and keyboard tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxtst-dev libpng-dev libx11-dev libxkbfile-dev libxinerama-dev
      - name: Install
        run: npm ci
      - name: Test
        if: runner.os == 'Linux'
        run: npm run test:unit
      - name: Build the installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish never
      - name: List the result
        shell: bash
        run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: forkwise-desktop-${{ runner.os }}
          path: |
            desktop-app/dist/forkwise-desktop-*
            desktop-app/dist/latest*.yml
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-app/dist/forkwise-desktop-*
            desktop-app/dist/latest*.yml
