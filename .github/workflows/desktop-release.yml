name: Desktop app release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: forkwise-desktop-windows.exe
            built: dist/forkwise-desktop.exe
          - os: macos-latest
            asset: forkwise-desktop-macos
            built: dist/forkwise-desktop
          - os: ubuntu-22.04
            asset: forkwise-desktop-linux
            built: dist/forkwise-desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux packages for the window and screen tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-dev scrot
      - name: Install build tools
        run: pip install pyinstaller websockets mss pillow pyautogui pyperclip
      - name: Build
        working-directory: backend/desktop
        run: pyinstaller --onefile --windowed --name forkwise-desktop --hidden-import browser_cdp --collect-submodules websockets forkwise_desktop.py
      - name: Name the file
        shell: bash
        run: cp "backend/desktop/${{ matrix.built }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
